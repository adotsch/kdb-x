context:
  version: ${{ env.get("MODULE_VERSION", default="20261020") }}
  modules: [bit, defer, flock, udp, selectk]

package:
  name: q-dot
  version: ${{ version }}

source:
  path: ..
  filter:
    exclude:
      - recipe/**

build:
  number: 0
  script:
    file: build.sh
    env:
      TARGET_PLATFORM: ${{ target_platform }}
  # The binaries are cross-compiled and have no conda dependencies to
  # relocate. Relinking would shell out to install_name_tool (macOS targets),
  # which doesn't exist on the linux build host.
  dynamic_linking:
    binary_relocation: false

requirements:
  build:
    - make
    - zig ==0.13.0
    - patchelf

tests:
  - if: target_platform == "linux-64"
    then:
      script:
        - test -f ${PREFIX}/lib/q/mod/dot/init.q
        - test -f ${PREFIX}/lib/q/mod/dot/bit/init.li64.so
        - test -f ${PREFIX}/lib/q/mod/dot/defer/init.li64.so
        - test -f ${PREFIX}/lib/q/mod/dot/flock/init.li64.so
        - test -f ${PREFIX}/lib/q/mod/dot/udp/init.li64.so
        - test -f ${PREFIX}/lib/q/mod/dot/selectk/init.li64.so
